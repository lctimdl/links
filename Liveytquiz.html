<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>UPMSP Solutions - Class 10 Science Live Quiz</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans Devanagari', 'sans-serif'],
            display: ['Rajdhani', 'Inter', 'sans-serif'],

  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background: #030712;
      color: #f8fafc;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
    }

    /* =========================================
       9:16 VERTICAL BROADCAST VIEWPORT
       ========================================= */

    .stream-viewport {
      position: relative;

      width: 100vw;
      height: 100vh;

      max-width: calc(100vh * 9 / 16);
      max-height: calc(100vw * 16 / 9);

      aspect-ratio: 9 / 16;

      background:
        radial-gradient(
          circle at 50% 8%,
          #1e1b4b 0%,
          #090d1a 42%,
          #030712 100%
        );

      display: flex;
      flex-direction: column;

      /* Reduced padding for vertical YouTube live */
      padding: 1.25rem 1.45rem 0.9rem 1.45rem;

      box-shadow:
        0 0 50px rgba(0,0,0,0.9),
        0 0 2px rgba(56,189,248,0.3);

      overflow: hidden;
    }

    /* =========================================
       BACKGROUND
       ========================================= */

    .bg-grid {
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          to right,
          rgba(56,189,248,0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          to bottom,
          rgba(56,189,248,0.025) 1px,
          transparent 1px
        );

      background-size: 30px 30px;

      pointer-events: none;
      z-index: 0;
    }

    .ambient-light-top {
      position: absolute;
      top: -130px;
      left: 50%;

      transform: translateX(-50%);

      width: 420px;
      height: 240px;

      background:
        radial-gradient(
          ellipse,
          rgba(59,130,246,0.25) 0%,
          rgba(14,165,233,0.07) 50%,
          transparent 80%
        );

      filter: blur(40px);

      pointer-events: none;
      z-index: 0;
    }

    .ambient-light-bottom {
      position: absolute;
      bottom: -90px;
      left: 50%;

      transform: translateX(-50%);

      width: 360px;
      height: 190px;

      background:
        radial-gradient(
          ellipse,
          rgba(99,102,241,0.20) 0%,
          transparent 70%
        );

      filter: blur(45px);

      pointer-events: none;
      z-index: 0;
    }

    /* =========================================
       HEADER
       ========================================= */

    header {
      flex-shrink: 0;
    }

    /* =========================================
       TIMER BAR
       Now placed ABOVE question
       ========================================= */

    .timer-area {
      position: relative;
      z-index: 20;

      width: 100%;

      margin-top: 0.55rem;
      margin-bottom: 0.7rem;
    }

    .timer-track {
      width: 100%;
      height: 9px;

      background: rgba(15,23,42,0.92);

      border-radius: 999px;

      padding: 2px;

      border: 1px solid rgba(71,85,105,0.75);

      box-shadow:
        inset 0 2px 4px rgba(0,0,0,0.8);
      
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      width: 100%;

      border-radius: 999px;

      will-change: width, background, box-shadow;

      transition:
        background 0.35s ease,
        box-shadow 0.35s ease;
    }

    .timer-normal {
      background:
        linear-gradient(
          90deg,
          #0284c7 0%,
          #06b6d4 50%,
          #38bdf8 100%
        );

      box-shadow:
        0 0 16px rgba(56,189,248,0.65);
    }

    .timer-warning {
      background:
        linear-gradient(
          90deg,
          #d97706 0%,
          #f59e0b 50%,
          #fbbf24 100%
        );

      box-shadow:
        0 0 20px rgba(245,158,11,0.85);

      animation: subtlePulse 1.4s infinite ease-in-out;
    }

    .timer-critical {
      background:
        linear-gradient(
          90deg,
          #dc2626 0%,
          #ef4444 50%,
          #f87171 100%
        );

      box-shadow:
        0 0 24px rgba(239,68,68,0.95);

      animation: subtlePulseCritical 0.8s infinite ease-in-out;
    }

    .timer-answer {
      background:
        linear-gradient(
          90deg,
          #059669 0%,
          #10b981 50%,
          #34d399 100%
        );

      box-shadow:
        0 0 22px rgba(16,185,129,0.8);
    }

    @keyframes subtlePulse {
      0%,100% {
        opacity: 1;
        filter: brightness(1);
      }

      50% {
        opacity: 0.88;
        filter: brightness(1.2);
      }
    }

    @keyframes subtlePulseCritical {
      0%,100% {
        opacity: 1;
        filter: brightness(1);
      }

      50% {
        opacity: 0.82;
        filter: brightness(1.35);
      }
    }

    /* =========================================
       QUESTION AREA
       ========================================= */

    #question-container {
      position: relative;
      z-index: 10;

      width: 100%;

      /* Slightly moved upward */
      margin-top: 0.15rem;
      margin-bottom: auto;

      padding-top: 0.1rem;
      padding-bottom: 0.3rem;
    }

    .question-counter {
      display: flex;
      justify-content: center;

      margin-bottom: 0.55rem;
    }

    .question-counter-inner {
      padding: 0.28rem 0.85rem;

      border-radius: 999px;

      background: rgba(30,41,59,0.82);

      border: 1px solid rgba(71,85,105,0.8);

      box-shadow:
        0 2px 8px rgba(0,0,0,0.25);
    }

    /* =========================================
       QUESTION CARD
       Smaller than original
       ========================================= */

    .question-card {
      border-radius: 1rem;

      padding: 0.95rem 1rem;

      background: rgba(15,23,42,0.84);

      border: 1px solid rgba(71,85,105,0.62);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      box-shadow:
        0 8px 28px rgba(0,0,0,0.48);
    }

    .question-text {
      text-shadow:
        0 2px 8px rgba(0,0,0,0.6);

      line-height: 1.38;
    }

    /* =========================================
       OPTION CARDS
       Smaller and tighter
       ========================================= */

    .options-grid {
      margin-top: 0.65rem;

      display: grid;
      grid-template-columns: 1fr;

      gap: 0.42rem;
    }

    .option-card {
      transition:
        all 0.3s cubic-bezier(0.16,1,0.3,1);

      border:
        1px solid rgba(255,255,255,0.08);

      background:
        rgba(15,23,42,0.72);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .option-letter {
      transition: all 0.25s ease;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid rgba(255,255,255,0.12);

      color: #94a3b8;
    }

    /* Correct Answer */

    .option-card.correct {
      background:
        linear-gradient(
          90deg,
          rgba(5,150,105,0.38) 0%,
          rgba(16,185,129,0.18) 100%
        ) !important;

      border:
        2px solid #10b981 !important;

      box-shadow:
        0 0 24px rgba(16,185,129,0.42),
        inset 0 0 14px rgba(16,185,129,0.18) !important;

      transform: scale(1.015);

      color: #ffffff !important;
    }

    .option-card.correct .option-letter {
      background: #10b981 !important;

      border-color: #34d399 !important;

      color: #022c22 !important;

      font-weight: 900;

      box-shadow:
        0 0 10px rgba(16,185,129,0.75);
    }

    /* Wrong options after reveal */

    .option-card.dimmed {
      opacity: 0.30;

      filter: grayscale(45%);

      transform: scale(0.985);

      border-color:
        rgba(255,255,255,0.04) !important;
    }

    /* =========================================
       FOOTER
       No timer text here
       ========================================= */

    footer {
      position: relative;
      z-index: 10;

      flex-shrink: 0;

      width: 100%;

      padding-top: 0.45rem;
      padding-bottom: 0.15rem;
    }

    .footer-line {
      width: 100%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-top: 0.25rem;

      padding-top: 0.35rem;

      border-top:
        1px solid rgba(30,41,59,0.65);

      font-size: 9px;
    }

    /* =========================================
       QUESTION TRANSITION
       ========================================= */

    .animate-content-switch {
      animation:
        stageFadeIn 0.32s
        cubic-bezier(0.16,1,0.3,1)
        forwards;
    }

    @keyframes stageFadeIn {

      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    /* =========================================
       EXTRA SMALL VERTICAL SCREENS
       ========================================= */

    @media (max-height: 700px) {

      .stream-viewport {
        padding:
          0.8rem
          1rem
          0.6rem
          1rem;
      }

      .question-card {
        padding:
          0.7rem
          0.8rem;
      }

      .options-grid {
        gap: 0.3rem;
        margin-top: 0.5rem;
      }

      .option-card {
        padding:
          0.55rem
          0.65rem;
      }

      .timer-area {
        margin-top: 0.35rem;
        margin-bottom: 0.5rem;
      }

      .timer-track {
        height: 7px;
      }
    }

  </style>
</head>

    /* =====================================================
       CONFIGURATION

      API_URL:

    /* =====================================================

      /* =========================

      {

        options: [

      {

      {
        question:
          "किसी चालक का प्रतिरोध उसकी लंबाई बढ़ाने पर सामान्यतः क्या होता है?",

        options: [
          "घटता है",
          "बढ़ता है",
          "शून्य हो जाता है",
          "अपरिवर्तित रहता है"
        ],

        answer:
          "बढ़ता है"
      }

    ];


    /* =====================================================
       REMOVE DUPLICATES
       ===================================================== */

    function removeDuplicateQuestions(questions) {

      const seen = new Set();

      return questions.filter(q => {

        const key =
          q.question
            .replace(/\s+/g, ' ')
            .trim()
            .toLowerCase();

        if (seen.has(key)) {
          return false;
        }

        seen.add(key);

        return true;

      });

    }


    /* =====================================================
       STATE
       ===================================================== */

    let quizData = [];

    let currentQuestionIndex = 0;

    let phase = 'QUESTION';

    let phaseStartTime = 0;

    let animFrameId = null;

    let currentDisplayedOptions = [];

    let currentCorrectAnswerText = '';


    /* =====================================================
       DOM
       ===================================================== */

    const uiChannelName =
      document.getElementById('ui-channel-name');

    const uiClassSubject =
      document.getElementById('ui-class-subject');

    const uiQuestionCounter =
      document.getElementById('ui-question-counter');

    const uiQuestionText =
      document.getElementById('ui-question-text');

    const questionContainer =
      document.getElementById('question-container');

    const uiTimerBar =
      document.getElementById('ui-timer-bar');


    const optionCards = [

      document.getElementById('option-card-0'),

      document.getElementById('option-card-1'),

      document.getElementById('option-card-2'),

      document.getElementById('option-card-3')

    ];


    const optionBadges = [

      document.getElementById('option-badge-0'),

      document.getElementById('option-badge-1'),

      document.getElementById('option-badge-2'),

      document.getElementById('option-badge-3')

    ];


    const optionTexts = [

      document.getElementById('option-text-0'),

      document.getElementById('option-text-1'),

      document.getElementById('option-text-2'),

      document.getElementById('option-text-3')

    ];


    /* =====================================================
       SHUFFLE
       ===================================================== */

    function shuffleArray(array) {

      const arr = [...array];

      for (
        let i = arr.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [
          arr[i],
          arr[j]
        ] =
        [
          arr[j],
          arr[i]
        ];

      }

      return arr;

    }


    /* =====================================================
       HEADER CONFIG
       ===================================================== */

    function applyHeaderConfig() {

      uiChannelName.textContent =
        CONFIG.CHANNEL_NAME ||
        "UPMSP Solutions";


      uiClassSubject.textContent =
        `${CONFIG.CLASS_NAME || "Class 10"} • ${CONFIG.SUBJECT_NAME || "Science"}`;

    }


    /* =====================================================
       INITIALIZE QUESTIONS
       ===================================================== */

    async function initQuestions() {

      applyHeaderConfig();


      if (
        CONFIG.API_URL &&
        CONFIG.API_URL !==
        "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"
      ) {

        try {

          const res =
            await fetch(CONFIG.API_URL);

          if (res.ok) {

            const data =
              await res.json();

            if (
              Array.isArray(data) &&
              data.length > 0
            ) {

              quizData =
                removeDuplicateQuestions(data);

            }

          }

        }

        catch (error) {

          console.warn(
            "Remote questions unavailable. Using built-in question bank.",
            error
          );

        }

      }


      if (
        !quizData ||
        quizData.length === 0
      ) {

        quizData =
          removeDuplicateQuestions(
            FALLBACK_QUESTIONS
          );

      }


      /* Initial shuffle */

      quizData =
        shuffleArray(quizData);


      currentQuestionIndex = 0;


      loadQuestion(
        currentQuestionIndex
      );

    }


    /* =====================================================
       LOAD QUESTION
       ===================================================== */

    function loadQuestion(index) {

      if (
        index >= quizData.length
      ) {

        if (CONFIG.LOOP_QUIZ) {

          quizData =
            shuffleArray(quizData);

          currentQuestionIndex = 0;

          index = 0;

        }

        else {

          return;

        }

      }


      const q =
        quizData[index];


      currentCorrectAnswerText =
        String(q.answer || '')
          .trim();


      /* Counter */

      const qNumberStr =
        String(index + 1)
          .padStart(2, '0');


      const totalStr =
        String(quizData.length)
          .padStart(2, '0');


      uiQuestionCounter.textContent =
        `QUESTION ${qNumberStr} / ${totalStr}`;


      /* Animation */

      questionContainer
        .classList
        .remove(
          'animate-content-switch'
        );


      void questionContainer.offsetWidth;


      questionContainer
        .classList
        .add(
          'animate-content-switch'
        );


      /* Question */

      uiQuestionText.textContent =
        q.question;


      /* Shuffle options */

      const rawOptions =
        Array.isArray(q.options)
          ? [...q.options]
          : [];


      currentDisplayedOptions =
        shuffleArray(rawOptions);


      const letters =
        ['A','B','C','D'];


      for (
        let i = 0;
        i < 4;
        i++
      ) {

        const card =
          optionCards[i];

        const badge =
          optionBadges[i];

        const textElem =
          optionTexts[i];


        /* Reset */

        card.className =
          'option-card flex items-center p-2 md:p-2.5 rounded-lg';


        badge.className =
          'option-letter w-7 h-7 md:w-8 md:h-8 flex-shrink-0 flex items-center justify-center rounded-md font-display text-xs md:text-sm font-bold mr-2.5';


        badge.textContent =
          letters[i];


        if (
          currentDisplayedOptions[i]
        ) {

          card.style.display =
            'flex';

          textElem.textContent =
            currentDisplayedOptions[i];

        }

        else {

          card.style.display =
            'none';

        }

      }


      startQuestionPhase();

    }


    /* =====================================================
       QUESTION PHASE
       ===================================================== */

    function startQuestionPhase() {

      phase =
        'QUESTION';


      phaseStartTime =
        performance.now();


      uiTimerBar.className =
        'timer-fill timer-normal';


      uiTimerBar.style.width =
        '100%';


      if (animFrameId) {

        cancelAnimationFrame(
          animFrameId
        );

      }


      animFrameId =
        requestAnimationFrame(
          updateBroadcastLoop
        );

    }


    /* =====================================================
       REVEAL ANSWER
       ===================================================== */

    function revealAnswer() {

      phase =
        'ANSWER';


      phaseStartTime =
        performance.now();


      for (
        let i = 0;
        i < 4;
        i++
      ) {

        const optionVal =
          String(
            currentDisplayedOptions[i] ||
            ''
          ).trim();


        const card =
          optionCards[i];


        const badge =
          optionBadges[i];


        if (
          optionVal.toLowerCase() ===
          currentCorrectAnswerText.toLowerCase()
        ) {

          card.classList.add(
            'correct'
          );

          badge.innerHTML =
            '✓';

        }

        else {

          card.classList.add(
            'dimmed'
          );

        }

      }


      /* Green answer timer */

      uiTimerBar.className =
        'timer-fill timer-answer';


      uiTimerBar.style.width =
        '100%';


      if (animFrameId) {

        cancelAnimationFrame(
          animFrameId
        );

      }


      animFrameId =
        requestAnimationFrame(
          updateBroadcastLoop
        );

    }


    /* =====================================================
       HIGH PRECISION TIMER
       ===================================================== */

    function updateBroadcastLoop(now) {


      /* QUESTION PHASE */

      if (phase === 'QUESTION') {

        const duration =
          CONFIG.QUESTION_TIME * 1000;


        const elapsed =
          now - phaseStartTime;


        const remaining =
          Math.max(
            0,
            duration - elapsed
          );


        const progress =
          Math.max(
            0,
            remaining / duration
          );


        uiTimerBar.style.width =
          (progress * 100).toFixed(2)
          + '%';


        const remainingSeconds =
          remaining / 1000;


        /* NORMAL */

        if (
          remainingSeconds > 10
        ) {

          if (
            !uiTimerBar.classList.contains(
              'timer-normal'
            )
          ) {

            uiTimerBar.className =
              'timer-fill timer-normal';

          }

        }


        /* WARNING */

        else if (
          remainingSeconds > 5
        ) {

          if (
            !uiTimerBar.classList.contains(
              'timer-warning'
            )
          ) {

            uiTimerBar.className =
              'timer-fill timer-warning';

          }

        }


        /* CRITICAL */

        else {

          if (
            !uiTimerBar.classList.contains(
              'timer-critical'
            )
          ) {

            uiTimerBar.className =
              'timer-fill timer-critical';

          }

        }


        /* TIME OVER */

        if (
          remaining <= 0
        ) {

          uiTimerBar.style.width =
            '0%';

          revealAnswer();

          return;

        }


        animFrameId =
          requestAnimationFrame(
            updateBroadcastLoop
          );

      }


      /* ANSWER PHASE */

      else if (
        phase === 'ANSWER'
      ) {

        const duration =
          CONFIG.ANSWER_TIME * 1000;


        const elapsed =
          now - phaseStartTime;


        const remaining =
          Math.max(
            0,
            duration - elapsed
          );


        const progress =
          Math.max(
            0,
            remaining / duration
          );


        uiTimerBar.style.width =
          (progress * 100).toFixed(2)
          + '%';


        if (
          remaining <= 0
        ) {

          uiTimerBar.style.width =
            '0%';


          currentQuestionIndex++;


          loadQuestion(
            currentQuestionIndex
          );


          return;

        }


        animFrameId =
          requestAnimationFrame(
            updateBroadcastLoop
          );

      }

    }


    /* =====================================================
       OBS / YOUTUBE AUTOSTART
       ===================================================== */

    window.addEventListener(
      'DOMContentLoaded',
      () => {

        initQuestions();

      }
    );

  </script>
